
name: Baymax Independent Background Study

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3,15 * * *'

permissions:
  contents: write

concurrency:
  group: baymax-independent-study
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Get Baymax code
        uses: actions/checkout@v4

      - name: Run Wikipedia research
        run: python3 research.py

      - name: Save public knowledge
        run: |
          git config user.name "baymax-study-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/knowledge.json
          if ! git diff --cached --quiet; then
            git commit -m "Baymax: refresh public knowledge"
            git push
          fi
